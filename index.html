<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanzador de Dados Virtual</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Lanzador de Dados Virtual</h1>
        <form id="diceForm">
            <label for="userName">Ingresa tu nombre:</label>
            <input type="text" id="userName" placeholder="Tu nombre">
            <button type="submit">Lanzar Dados</button>
        </form>

        <div id="result" class="hidden">
            <h2 id="greeting"></h2>
            <p id="diceResult"></p>
            <p id="sumResult"></p>
            <p id="finalResult"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
